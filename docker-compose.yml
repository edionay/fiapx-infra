services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fiapx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fiapx"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: fiapx
      RABBITMQ_DEFAULT_PASS: fiapx
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  migrate:
    build:
      context: ../fiapx-api
      target: build
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fiapx?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ../fiapx-worker
    environment:
      RABBITMQ_URL: amqp://fiapx:fiapx@rabbitmq:5672
      OUTPUTS_DIR: /data/outputs
      METRICS_ADDR: ":9091"
    volumes:
      - dados:/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  api:
    build:
      context: ../fiapx-api
      target: runtime
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fiapx?schema=public
      RABBITMQ_URL: amqp://fiapx:fiapx@rabbitmq:5672
      JWT_SECRET: troque-este-segredo-em-producao
      JWT_EXPIRACAO_SEGUNDOS: "3600"
      UPLOADS_DIR: /data/uploads
    ports:
      - "3000:3000"
    volumes:
      - dados:/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  rabbitmq:
  dados:
